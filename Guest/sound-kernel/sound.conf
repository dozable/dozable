# The ONLY change to kata-containers 3.28.0's arm64 kernel config (Linux 6.18.15, kata_config_version 186) for a
# sandbox with sound: virtio-snd and ALSA, built in (the kernel has CONFIG_MODULES off). Everything these select comes
# with them (SND_PCM, SND_TIMER, SND_JACK, …) — `olddefconfig` resolves them; nothing outside sound changes.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_VIRTIO=y
CONFIG_SND_PROC_FS=y
